name: MERN CI/CD Pipeline
on: [push]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd backend && npm install
      - run: cd frontend && npm install && npm run build
      - name: CD Deploy Hooks
        if: success()
        run: |
          if [ -n "${{ secrets.RENDER_BACKEND }}" ]; then curl -X POST "${{ secrets.RENDER_BACKEND }}"; fi
          if [ -n "${{ secrets.RENDER_FRONTEND }}" ]; then curl -X POST "${{ secrets.RENDER_FRONTEND }}"; fi
